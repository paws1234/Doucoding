server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles are immutable; the HTML shell must never be cached.
  # Confirmed against the real `expo export` output: the hashed assets live under
  # `_expo/static/{css,js}/` — there is no top-level `assets/` folder.
  location ~* ^/(_expo|assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;   # SPA fallback for client-side routes
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
